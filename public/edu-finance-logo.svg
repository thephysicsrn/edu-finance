<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0055ff" />
      <stop offset="100%" stopColor="#003cd6" />
    </linearGradient>
    <linearGradient id="eduGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00c878" />
      <stop offset="100%" stopColor="#00a862" />
    </linearGradient>
  </defs>

  <!-- ÍCONE PRINCIPAL -->
  <g transform="translate(10, 10)">
    <!-- Cartão / Base com cantos arredondados -->
    <rect x="8" y="12" width="76" height="76" rx="16" stroke="url(#eduBlue)" stroke-width="9" fill="#ffffff" />
    <!-- Guias superiores -->
    <rect x="22" y="6" width="9" height="13" rx="4.5" fill="#0055ff" />
    <rect x="61" y="6" width="9" height="13" rx="4.5" fill="#0055ff" />
    <!-- Linha divisória -->
    <line x1="12" y1="38" x2="80" y2="38" stroke="#0055ff" stroke-width="5" stroke-linecap="round" />
    <!-- Barras de crescimento financeiro -->
    <rect x="23" y="58" width="8" height="18" rx="3" fill="#0055ff" />
    <rect x="37" y="48" width="8" height="28" rx="3" fill="#0055ff" />
    <rect x="51" y="42" width="8" height="34" rx="3" fill="#0055ff" />
    <!-- Selo de Aprovação Verde (Check) -->
    <circle cx="76" cy="76" r="22" fill="url(#eduGreen)" stroke="#ffffff" stroke-width="2.5" />
    <path d="M68 76 L73 81 L85 69" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- TEXTO TIPOGRAFIA DA MARCA -->
  <text x="125" y="65" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5">
    <tspan fill="#07132c">Edu</tspan><tspan fill="#0052ff">.Finance</tspan>
  </text>

  <!-- SLOGAN OFICIAL -->
  <text x="128" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.2" fill="#0e1c36">
    INTELIGÊNCIA EM GESTÃO FINANCEIRA.
  </text>
  <text x="128" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.2" fill="#0052ff">
    MAIS CONTROLE PARA EDUCAR.
  </text>
</svg>

