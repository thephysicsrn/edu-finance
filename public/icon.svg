<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0055ff" />
      <stop offset="100%" stopColor="#003cd6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00c878" />
      <stop offset="100%" stopColor="#00a862" />
    </linearGradient>
  </defs>

  <!-- Cartão Base com borda azul royal -->
  <rect x="12" y="16" width="82" height="82" rx="18" stroke="url(#blueGrad)" stroke-width="10" fill="#ffffff" />
  
  <!-- Guias Superiores -->
  <rect x="26" y="10" width="10" height="14" rx="5" fill="#0055ff" />
  <rect x="70" y="10" width="10" height="14" rx="5" fill="#0055ff" />

  <!-- Linha divisória horizontal interna -->
  <path d="M17 44 H89" stroke="#0055ff" stroke-width="6" stroke-linecap="round" />

  <!-- Barras financeiras em crescimento -->
  <rect x="28" y="66" width="9" height="18" rx="4" fill="#0055ff" />
  <rect x="44" y="56" width="9" height="28" rx="4" fill="#0055ff" />
  <rect x="60" y="50" width="9" height="34" rx="4" fill="#0055ff" />

  <!-- Selo de Validação Verde com Checkmark -->
  <circle cx="86" cy="86" r="24" fill="url(#greenGrad)" />
  <circle cx="86" cy="86" r="23" stroke="#ffffff" stroke-width="3" fill="none" />
  <path d="M77 86 L83 92 L96 79" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>

